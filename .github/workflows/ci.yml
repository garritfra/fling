name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Firestore-Emulator für die Security-Rules-Tests
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
